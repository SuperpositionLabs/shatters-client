name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string
      sdk_ref:
        description: "Branch / tag / commit of shatters-sdk to build against."
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            sdk_preset: linux-release
            sdk_build_dir: linux-release
            rust_target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-2022
            sdk_preset: windows-x64-release
            sdk_build_dir: windows-x64-release
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      # The Tauri client expects the SDK at ../shatters-sdk relative to the
      # client repo root (src-tauri/bridge/build.rs resolves
      # ../../../shatters-sdk/build/<preset> from src-tauri/bridge/).
      #
      # Layout on the runner:
      #   $GITHUB_WORKSPACE              <-- shatters-client (this repo)
      #   $GITHUB_WORKSPACE/../shatters-sdk
      #   $GITHUB_WORKSPACE/../vcpkg
      #
      # We deliberately do NOT use `path: shatters-client` for the client
      # checkout. Nesting the project under a sub-directory breaks
      # tauri-action's artifact-discovery glob (it looks for
      # src-tauri/target/<target>/release/bundle/... relative to the runner
      # cwd, which differs from the projectPath used during the build).
      - name: Checkout shatters-client
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Resolve SDK ref
        id: sdkref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.sdk_ref }}" >> "$GITHUB_OUTPUT"
          else
            # For tag pushes, default to the matching tag in the SDK repo if
            # it exists, otherwise fall back to main. This lets you cut
            # coordinated releases by tagging both repos with the same
            # version.
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone shatters-sdk (matching tag, fallback to main)
        shell: bash
        env:
          SDK_REF: ${{ steps.sdkref.outputs.value }}
        run: |
          set -euo pipefail
          SDK_DIR="${{ github.workspace }}/../shatters-sdk"
          rm -rf "$SDK_DIR"
          # Initial bare init so we can selectively fetch the desired ref
          # without paying for the full clone, and so we can fall back to
          # main if the matching tag doesn't exist in the SDK repo.
          git init -q "$SDK_DIR"
          cd "$SDK_DIR"
          git remote add origin https://github.com/superpositionlabs/shatters-sdk.git
          if git fetch --depth 1 origin "$SDK_REF"; then
            echo "Using shatters-sdk@$SDK_REF"
          else
            echo "shatters-sdk ref '$SDK_REF' not found, falling back to main"
            git fetch --depth 1 origin main
          fi
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      # ----- Toolchains -------------------------------------------------------

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev file

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache cargo (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.platform.name }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/bridge/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform.name }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ matrix.platform.name }}-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform.name }}-target-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ----- vcpkg + native SDK ----------------------------------------------

      - name: Export GitHub Actions cache env (for vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/../vcpkg
          vcpkgJsonGlob: ${{ github.workspace }}/../shatters-sdk/vcpkg.json
          # The SDK's vcpkg.json has no builtin-baseline and the SDK repo
          # does not vendor vcpkg as a submodule on CI, so pin a known-good
          # commit here. Bump in lockstep with the local shatters-sdk/vcpkg
          # pin.
          vcpkgGitCommitId: efa4634bd526b87559684607d2cbbdeeec0f07d8

      - name: Configure shatters-sdk
        working-directory: ${{ github.workspace }}/../shatters-sdk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
        run: cmake --preset ${{ matrix.platform.sdk_preset }}

      - name: Build shatters-sdk
        working-directory: ${{ github.workspace }}/../shatters-sdk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
        run: cmake --build build/${{ matrix.platform.sdk_build_dir }} --target shatters-sdk --config Release -j

      # ----- Frontend + Tauri bundle -----------------------------------------

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Tauri app icons
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri bundles
        env:
          # tauri-cli build invokes cargo, which invokes the bridge build.rs.
          # Make sure it can find the SDK static lib.
          SHATTERS_SDK_DIR: ${{ github.workspace }}/../shatters-sdk
        # Use the locally-installed @tauri-apps/cli (from npm ci) via the
        # `tauri` script in package.json. `npx --yes` would happily download
        # an unrelated version if it couldn't find the local one, masking
        # bundling failures. Force --bundles so the step fails loudly if the
        # bundle phase is skipped for any reason.
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            BUNDLES="deb,rpm,appimage"
          else
            BUNDLES="msi,nsis"
          fi
          npm run tauri -- build \
            --target ${{ matrix.platform.rust_target }} \
            --bundles "$BUNDLES" \
            --verbose

      - name: Collect release artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/release-artifacts"
          mkdir -p "$OUT"
          BUNDLE_DIR="src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle"
          # Match all bundle outputs across platforms; ignore .sig sidecars
          # (we don't sign updates yet).
          shopt -s nullglob globstar
          for f in "$BUNDLE_DIR"/**/*.{deb,rpm,AppImage,msi,exe,dmg,app.tar.gz}; do
            [ -f "$f" ] || continue
            cp -v "$f" "$OUT/"
          done
          ls -la "$OUT"
          # Fail loudly if nothing was produced.
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "::error::No bundles produced under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -maxdepth 3 -type f || true
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          # Create the release once (idempotent across matrix jobs).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "Shatters $TAG" \
              --notes "Automated release for $TAG"
          fi
          gh release upload "$TAG" \
            "${{ github.workspace }}/release-artifacts/"* \
            --clobber
