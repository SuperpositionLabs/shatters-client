name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string
      sdk_ref:
        description: "Branch / tag / commit of shatters-sdk to build against."
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            sdk_preset: linux-release
            sdk_build_dir: linux-release
            rust_target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-2022
            sdk_preset: windows-x64-release
            sdk_build_dir: windows-x64-release
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      # The Tauri client expects the SDK at ../shatters-sdk relative to the
      # client repo root (src-tauri/bridge/build.rs resolves
      # ../../../shatters-sdk/build/<preset>). We lay out the workspace as:
      #   <runner>/shatters-client   <-- this repo
      #   <runner>/shatters-sdk      <-- sibling clone of the SDK repo
      - name: Checkout shatters-client
        uses: actions/checkout@v4
        with:
          path: shatters-client
          # Pin the exact ref being built. For tag pushes this is
          # refs/tags/<tag>; for workflow_dispatch it's the selected branch.
          # Avoids actions/checkout deriving an ambiguous refspec from the
          # tag name (e.g. fetching +refs/heads/v1.0.0*) which can leave the
          # working tree without a valid .git directory.
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Resolve SDK ref
        id: sdkref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.sdk_ref }}" >> "$GITHUB_OUTPUT"
          else
            # For tag pushes, default to the matching tag in the SDK repo if it
            # exists, otherwise fall back to main. This lets you cut coordinated
            # releases by tagging both repos with the same version.
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout shatters-sdk (matching tag, fallback to main)
        uses: actions/checkout@v4
        with:
          repository: superpositionlabs/shatters-sdk
          ref: ${{ steps.sdkref.outputs.value }}
          path: shatters-sdk
          submodules: recursive
          fetch-depth: 1
        continue-on-error: true
        id: sdk_tag_checkout

      - name: Checkout shatters-sdk@main (fallback)
        if: steps.sdk_tag_checkout.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: superpositionlabs/shatters-sdk
          ref: main
          path: shatters-sdk
          submodules: recursive
          fetch-depth: 1

      # ----- Toolchains -------------------------------------------------------

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev file

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache cargo (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.platform.name }}-cargo-${{ hashFiles('shatters-client/src-tauri/Cargo.lock', 'shatters-client/src-tauri/bridge/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform.name }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: shatters-client/src-tauri/target
          key: ${{ matrix.platform.name }}-target-${{ hashFiles('shatters-client/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform.name }}-target-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shatters-client/package-lock.json

      # ----- vcpkg + native SDK ----------------------------------------------

      - name: Export GitHub Actions cache env (for vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: shatters-sdk/vcpkg.json
          # The SDK's vcpkg.json has no builtin-baseline and the SDK repo does
          # not vendor vcpkg as a submodule on CI, so pin a known-good commit
          # here. Bump in lockstep with the local shatters-sdk/vcpkg pin.
          vcpkgGitCommitId: efa4634bd526b87559684607d2cbbdeeec0f07d8

      - name: Configure shatters-sdk
        working-directory: shatters-sdk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset ${{ matrix.platform.sdk_preset }}

      - name: Build shatters-sdk
        working-directory: shatters-sdk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --build build/${{ matrix.platform.sdk_build_dir }} --target shatters-sdk --config Release -j

      # ----- Frontend + Tauri bundle -----------------------------------------

      - name: Install npm dependencies
        working-directory: shatters-client
        run: npm ci

      - name: Generate Tauri app icons
        working-directory: shatters-client
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & upload (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: shatters-client
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: "Shatters ${{ steps.tag.outputs.value }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.rust_target }}
